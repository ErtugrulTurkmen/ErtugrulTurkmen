<svg xmlns="http://www.w3.org/2000/svg" width="846" height="102" viewBox="0 0 846 102" role="img" aria-label="Drawn by Ertuğrul Efe Türkmen. Checked by GitHub Actions every 6 hours, with the date of the last revision. Numbers and drawings are regenerated from live GitHub data; private work is counted, never named.">
<title>Drawn by Ertuğrul Efe Türkmen. Checked by GitHub Actions every 6 hours, with the date of the last revision. Numbers and drawings are regenerated from live GitHub data; private work is counted, never named.</title>
<defs><pattern id="minor" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#222220" stroke-width=".6"/></pattern><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#minor)"/><path d="M60 0H0V60" fill="none" stroke="#30302e" stroke-width=".7"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V4" stroke="#30302e" stroke-width=".8"/></pattern></defs>
<style>text{font-family:Charter, 'Bitstream Charter', 'Iowan Old Style', Cambria, 'Sitka Text', Georgia, serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.n{font-variant-numeric:tabular-nums}.d{stroke-dasharray:1;animation:d 1.3s cubic-bezier(.45,0,.25,1) both}@keyframes d{from{stroke-dashoffset:1}}.f{animation:f .7s ease-out both}@keyframes f{from{opacity:0}}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}</style>
<g fill="#f5f4ed"><rect x="0.5" y=".5" width="845" height="101" rx="6" fill="#141413" stroke="#30302e"/><text x="16" y="21" font-size="9" fill="#96938a" letter-spacing="1" class="m">DRAWN BY</text><text x="16" y="42" font-size="15" class="n">Ertuğrul Efe Türkmen</text><rect x="287.6" y="0" width="1" height="56" fill="#30302e"/><text x="303.6" y="21" font-size="9" fill="#96938a" letter-spacing="1" class="m">CHECKED BY</text><text x="303.6" y="42" font-size="15" class="n">GitHub Actions, every 6 h</text><rect x="541.4" y="0" width="1" height="56" fill="#30302e"/><text x="557.4" y="21" font-size="9" fill="#96938a" letter-spacing="1" class="m">REVISION</text><text x="557.4" y="42" font-size="15" class="n">2026-10-03</text><rect x="702.2" y="0" width="1" height="56" fill="#30302e"/><text x="718.2" y="21" font-size="9" fill="#96938a" letter-spacing="1" class="m">SHEET</text><text x="718.2" y="42" font-size="15" class="n">01 OF 06</text><rect x="0" y="56" width="846" height="1" fill="#30302e"/><text x="16" y="82" font-size="9" fill="#96938a" letter-spacing="1" class="m">NOTE</text><text x="68" y="82" font-size="14" fill="#b5b2a6">Numbers and drawings are regenerated from live GitHub data. Private work is counted, never named.</text></g>
</svg>
