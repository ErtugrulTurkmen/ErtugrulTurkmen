<svg xmlns="http://www.w3.org/2000/svg" width="846" height="384" viewBox="0 0 846 384" role="img" aria-label="ExifCleaner (in development, soon public source): Desktop privacy tool. A desktop tool, in development, that will strip EXIF and other metadata from photos on your own machine. Designed so nothing leaves the device. Context isolation and a CSP from day one. Will be open source. Stack: Electron, ExifTool, Tailwind.">
